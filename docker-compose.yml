version: '3.9'

services:

  # ── PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: case-notes-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: case_management
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d case_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Spring Boot API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: case-notes-api
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/case_management
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8080
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: DEBUG
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── React Frontend (development mode via Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: case-notes-frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
